services:
  - type: web
    name: jair-veiculos
    runtime: node
    # FREE, por decisão do Alexandre (15/08/2026), sabendo do que segue.
    #
    # O serviço hiberna após 15 minutos sem visita e leva ~1 MINUTO pra acordar.
    # Num site de venda isso custa exatamente o cliente que o site existe pra
    # atender: o comprador clica o link que o Jair mandou no WhatsApp, encara um
    # minuto de tela de carregamento e desiste — e o Jair nunca fica sabendo que
    # perdeu o contato.
    #
    # Há também um teto de 750 horas de instância por mês no workspace inteiro,
    # compartilhado com os outros serviços free. Estourou, tudo suspende até o
    # mês virar.
    #
    # Trocar para `plan: starter` (US$ 7/mês) resolve os dois. É uma linha.
    plan: free

    # `npm ci` instala exatamente o que está no package-lock.json. Não trocar por
    # `npm install`: next-auth está em versão beta e uma resolução nova trocaria
    # a biblioteca de autenticação sem ninguém pedir.
    buildCommand: npm ci && npm run build
    startCommand: npm start

    envVars:
      - key: NODE_ENV
        value: production

      # ATENÇÃO: com NODE_ENV=production o npm pula as devDependencies. Por isso
      # tailwind, typescript e os @types estão em `dependencies` no package.json,
      # e não em `devDependencies` — se voltarem pra lá, o build quebra aqui.

      - key: AUTH_SECRET
        generateValue: true

      # Sem isto o next-auth v5 recusa o login atrás do proxy do Render, com um
      # erro de host não confiável que não explica nada.
      - key: AUTH_TRUST_HOST
        value: true

      # Preenchido À MÃO no painel (Environment), com a URL INTERNA do banco.
      # Não usar `fromDatabase`: aquilo monta a string com a senha que o próprio
      # Render guarda, e aí não dá pra rotacionar a credencial — um ALTER USER no
      # banco não chega até aqui e o serviço para de conectar no restart seguinte.
      - key: DATABASE_URL
        sync: false

      # Endereço público do site. Entra no preview de link e no sitemap — se
      # ficar errado, o cartão que aparece no WhatsApp aponta pro lugar errado.
      - key: NEXT_PUBLIC_URL_SITE
        sync: false

      # "local" grava foto no disco do container, que É APAGADO A CADA DEPLOY.
      # Em produção tem que ser "r2".
      - key: ARMAZENAMENTO
        value: r2

      # Credenciais da Cloudflare R2, preenchidas no painel.
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET
        sync: false
      - key: R2_URL_PUBLICA
        sync: false

databases:
  # FREE, por decisão do Alexandre (15/08/2026).
  #
  # ⚠️ PRAZO CURTO: o Postgres gratuito do Render EXPIRA 30 DIAS depois de
  # criado. Depois disso há 14 dias de carência para migrar para um plano pago;
  # passou, o Render APAGA o banco. Não é aviso teórico — leva junto o estoque
  # e o histórico financeiro inteiro do Jair.
  #
  # Se este banco foi criado em 15/08/2026:
  #   expira em ~14/09/2026, apagado em ~28/09/2026.
  #
  # Antes disso: trocar para `plan: basic-256mb` (US$ 10,50/mês) OU exportar os
  # dados e migrar. Ponha um lembrete no celular hoje, não depois.
  - name: jair-veiculos-db
    plan: free
    databaseName: jairveiculos
    user: jairveiculos
